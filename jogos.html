const games=[['Corrida pelo Tempo','Ordene as relíquias na linha do tempo.','CRONOLOGIA',timelineGame],['Detetive da História','Procure objetos históricos escondidos no arquivo.','OBJETOS OCULTOS',detectiveGame],['Conexões Históricas','Vire cartas e encontre pares de conceitos.','MEMÓRIA',memoryGame],['Expedição Romana','Atravesse o labirinto e recolha os artefatos.','AVENTURA',mazeGame],['Geografia Histórica','Trace rotas pelo Mediterrâneo e descubra cidades.','MAPA',mapGame],['Crônicas de Capivara','Explore diferentes períodos da História com Gabi e Gio, suas capivarinhas guias.','',platformGame]];
games.forEach(([name,desc],i)=>{const b=document.createElement('button');b.className='game-card';b.innerHTML=`<div class="cover${i===5?' chronicle-card-cover':''}">${cover(i)}</div><div class="card-copy"><h2>${name}</h2><p>${desc}</p><strong>Jogar</strong></div>`;b.onclick=()=>launch(i);$('gallery').append(b)});
let roundNo=0;const missions=['Arquivo do tempo','Câmara de artefatos','Biblioteca imperial','Via Ápia','Rotas mediterrâneas','Aventura de plataforma'];function launch(i,keep=false){if(!keep)roundNo=0;cleanup();cleanup=()=>{};current=i;$('gallery').hidden=true;$('arena').hidden=false;$('gameTitle').textContent=games[i][0];$('gameStatus').hidden=i===5;$('gameStatus').textContent=i===5?'':'ROMA IMPERIAL · '+missions[i];stage.innerHTML='';games[i][3]();if(i!==5){const banner=document.createElement('div');banner.className='mission-guide';banner.innerHTML='<img class="mission-portrait" alt="" src="img/'+(i%2?'gio':'gabi')+'-portrait.webp">'+'<div><strong>'+(i%2?'Gio, sua guia':'Gabi, seu guia')+'</strong><span>Missão '+(roundNo+1)+' de 2 · '+missions[i]+'</span></div>';stage.prepend(banner)}$('arena').scrollIntoView({block:'start',behavior:'smooth'})}$('leave').onclick=()=>{cleanup();cleanup=()=>{};current=null;$('arena').hidden=true;$('gallery').hidden=false;stage.innerHTML='';$('gallery').scrollIntoView({block:'start',behavior:'smooth'})};function win(title,desc){cleanup();cleanup=()=>{};if(current!==5&&roundNo===0){stage.innerHTML=`<div class="complete"><h3>${title}</h3><p>${desc}</p><p>Uma nova missão está disponível.</p><button class="action" id="again">Avançar para missão 2</button></div>`;$('again').onclick=()=>{roundNo=1;launch(current,true)}}else{stage.innerHTML=`<div class="complete"><h3>${title}</h3><p>${desc}</p><p>Expedição concluída!</p><button class="action" id="again">Jogar novamente</button></div>`;$('again').onclick=()=>launch(current)}}
function timelineGame(){const events=roundNo?[['64 d.C.','Grande incêndio de Roma'],['80 d.C.','Inauguração do Coliseu'],['212 d.C.','Constituição Antoniniana'],['284 d.C.','Diocleciano assume o poder'],['330 d.C.','Inauguração de Constantinopla'],['410 d.C.','Saque de Roma pelos visigodos']]:[['27 a.C.','Início do Império com Augusto'],['79 d.C.','Erupção do Vesúvio'],['117 d.C.','Extensão máxima sob Trajano'],['313 d.C.','Édito de Milão'],['395 d.C.','Divisão definitiva do Império'],['476 d.C.','Fim do Império do Ocidente']];let placed=0,tries=0,picked=null;stage.innerHTML=`<h3>Reconstrua o tempo</h3><p>Escolha uma relíquia e encaixe-a na próxima posição da linha do tempo, do acontecimento mais antigo ao mais recente. Também é possível arrastar.</p><div class="hud"><span id="tl-progress">0 / 6 acontecimentos</span><span id="tl-tries">0 encaixes errados</span></div><div class="timeline" id="slots"></div><div class="deck" id="deck"></div><p class="notice" id="msg" role="status">Selecione a primeira relíquia.</p>`;events.forEach((_,i)=>{let s=document.createElement('button');s.className='slot';s.innerHTML=`<strong>${i+1}</strong><span>${i===0?'Mais antigo':'Posição '+(i+1)}</span>`;s.setAttribute('aria-label','Posição '+(i+1));s.onclick=()=>put(i);s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();picked=Number(e.dataTransfer.getData('text/plain'));put(i)};$('slots').append(s)});shuffle(events.map((e,i)=>({e,i}))).forEach(({e,i})=>{let b=document.createElement('button');b.className='timecard';b.dataset.i=i;b.draggable=true;b.innerHTML=`${e[0]}<small>${e[1]}</small>`;b.onclick=()=>select(i);b.ondragstart=e=>{select(i);e.dataTransfer.setData('text/plain',i)};$('deck').append(b)});function select(i){if(i<placed)return;picked=i;document.querySelectorAll('.timecard').forEach(b=>b.classList.toggle('chosen',+b.dataset.i===i));$('msg').textContent='Agora encaixe a relíquia na posição '+(placed+1)+'.'}function put(slot){if(picked===null)return;if(slot!==placed||picked!==placed){tries++;$('tl-tries').textContent=tries+' encaixes errados';$('msg').textContent='Essa relíquia não é a próxima. Compare as datas.';return}let s=$('slots').children[placed];s.classList.add('filled');s.innerHTML=`<strong>${events[placed][0]}</strong><span>${events[placed][1]}</span>`;let b=document.querySelector(`.timecard[data-i="${picked}"]`);b.disabled=true;b.classList.remove('chosen');b.draggable=false;placed++;picked=null;$('tl-progress').textContent=placed+' / 6 acontecimentos';$('msg').textContent=placed===6?'Linha do tempo restaurada!':'Encaixe certo! Selecione a próxima relíquia.';if(placed===6)win('Linha do tempo restaurada!',`Você organizou seis acontecimentos da história romana com ${tries} encaixes errados.`)}}
function detectiveGame(){const targets=roundNo?[['column','Coluna','A arquitetura monumental expressava o poder romano.'],['ship','Navio','O Mediterrâneo conectava portos e mercados.'],['cross','Cruz','O cristianismo difundiu-se pelo Império.'],['book','Livro','A escrita preservava leis e conhecimento.'],['arch','Arco','Arcos e aquedutos ilustram a engenharia romana.']]:[['coin','Moeda imperial','As moedas facilitavam trocas e divulgavam o poder imperial.'],['scroll','Pergaminho','Os registros escritos ajudavam a administrar o Império.'],['amphora','Ânfora','Ânforas transportavam produtos como vinho e azeite.'],['wheat','Trigo','O trigo era distribuído à plebe na política do pão e circo.'],['helmet','Elmo','O equipamento militar lembra a atuação do exército romano.']];let found=new Set(),mistakes=0;const all=shuffle([...targets.map((t,i)=>({icon:t[0],target:i})),...Array.from({length:19},(_,i)=>({icon:(roundNo?['coin','scroll','amphora','wheat','helmet','key']:['column','ship','cross','book','key','arch'])[i%6],target:-1}))]);stage.innerHTML=`<h3>Arquivo de artefatos</h3><p>Há cinco artefatos desaparecidos entre os objetos do arquivo. Encontre os que aparecem na lista, sem recolher os outros.</p><div class="hud"><span id="det-count">0 / 5 relíquias</span><span id="det-misses">0 enganos</span></div><div class="object-list" id="wanted"></div><div id="room" class="board room" aria-label="Arquivo com objetos escondidos"></div><p class="notice" id="msg" role="status">Observe os símbolos da lista e explore o arquivo.</p>`;targets.forEach((t,i)=>{let s=document.createElement('span');s.id='wanted-'+i;s.innerHTML=art(t[0])+t[1];$('wanted').append(s)});all.forEach(o=>{let b=document.createElement('button');b.className='tile';b.innerHTML=art(o.icon);b.setAttribute('aria-label','Objeto: '+({coin:'moeda',scroll:'pergaminho',amphora:'ânfora',wheat:'trigo',helmet:'elmo',column:'coluna',ship:'navio',cross:'cruz',book:'livro',key:'chave',arch:'arco'}[o.icon]||o.icon));b.onclick=()=>{if(b.disabled)return;if(o.target<0){mistakes++;b.classList.add('miss');b.disabled=true;$('det-misses').textContent=mistakes+' enganos';$('msg').textContent='Este objeto não está na lista da missão.';return}found.add(o.target);b.disabled=true;b.classList.add('found');$('wanted-'+o.target).classList.add('done');$('det-count').textContent=found.size+' / 5 relíquias';$('msg').textContent=targets[o.target][2];if(found.size===5){$('msg').textContent=targets[o.target][2];let done=document.createElement('button');done.className='action';done.textContent='Concluir investigação';done.onclick=()=>win('Arquivo recuperado!',`Você encontrou os cinco artefatos, com ${mistakes} enganos.`);stage.append(done)}};$('room').append(b)})}
function memoryGame(){const pairs=roundNo?[['Trajano','Expansão territorial máxima'],['Colonato','Trabalho em propriedades rurais'],['Tetrarquia','Governo de quatro'],['Romanização','Difusão de costumes romanos'],['Odoacro','Deposição de Rômulo Augusto'],['Justiniano','Imperador bizantino']]:[['Pax Romana','Estabilidade imperial'],['Pão e circo','Trigo e espetáculos'],['Ruralização','Deslocamento para o campo'],['Édito de Milão','Tolerância religiosa'],['Augusto','Primeiro imperador'],['Constantinopla','Capital do Oriente']];const cards=shuffle(pairs.flatMap((p,i)=>p.map(t=>({t,i}))));let first=null,locked=false,matches=0,turns=0,timer;cleanup=()=>clearTimeout(timer);stage.innerHTML=`<h3>Memória do Império</h3><p>Vire duas cartas por vez. Encontre o conceito que corresponde à sua descrição histórica.</p><div class="hud"><span id="pairs">0 / 6 pares</span><span id="turns">0 jogadas</span></div><div class="board memory" id="memory"></div><p class="notice" id="msg" role="status">Escolha duas cartas.</p>`;cards.forEach((c,i)=>{let b=document.createElement('button');b.innerHTML='<span class="symbol">◆</span>';b.setAttribute('aria-label','Carta '+(i+1)+' fechada');b.onclick=()=>flip(b,c);$('memory').append(b)});function flip(b,c){if(locked||b.classList.contains('matched')||b.classList.contains('flipped'))return;b.classList.add('flipped');b.textContent=c.t;b.setAttribute('aria-label',c.t);if(!first){first={b,c};return}turns++;$('turns').textContent=turns+' jogadas';if(first.c.i===c.i){for(const el of [first.b,b]){el.classList.remove('flipped');el.classList.add('matched');el.disabled=true}matches++;$('pairs').textContent=matches+' / 6 pares';$('msg').textContent='Conexão histórica encontrada!';first=null;if(matches===6)win('Todas as conexões!',`Você completou os seis pares em ${turns} jogadas.`)}else{locked=true;$('msg').textContent='Essas cartas não formam um par.';const a=first.b;timer=setTimeout(()=>{for(const el of [a,b]){el.classList.remove('flipped');el.innerHTML='<span class="symbol">◆</span>';el.setAttribute('aria-label','Carta fechada')}first=null;locked=false},850)}}}
function mazeGame(){const rows=['###########','#S...#...1#','###.#.#.###','#2..#.#...#','#.###.###.#','#.........#','#.###.#.#.#','#...#3#.#4#','###.###.#.#','#........E#','###########'];if(roundNo)rows.reverse();let pos=roundNo?[1,9]:[1,1],collected=new Set(),steps=0;const info={'1':['coin','Moeda: o comércio ligava as províncias.'],'2':['wheat','Trigo: alimento distribuído à plebe romana.'],'3':['scroll','Pergaminho: os registros apoiavam a administração imperial.'],'4':['amphora','Ânfora: utilizada no transporte de vinho e azeite.']};stage.innerHTML=`<h3>As estradas de Roma</h3><p>Conduza o viajante pelo caminho. Recolha os quatro artefatos e alcance a saída dourada. Use as setas, WASD ou os controles da tela.</p><div class="hud"><span id="maze-count">0 / 4 artefatos</span><span id="maze-steps">0 passos</span></div><div class="board maze" id="maze" aria-label="Labirinto romano"></div><div class="controls"><button data-dir="left" aria-label="Esquerda">←</button><button data-dir="up" aria-label="Cima">↑</button><button data-dir="down" aria-label="Baixo">↓</button><button data-dir="right" aria-label="Direita">→</button></div><p class="notice" id="msg" role="status">Encontre os quatro artefatos antes de sair.</p>`;const dirs={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};function render(){const m=$('maze');m.replaceChildren();rows.forEach((row,y)=>[...row].forEach((c,x)=>{let cell=document.createElement('div');cell.className='cell'+(c==='#'?' wall':c==='E'?' goal':info[c]&&!collected.has(c)?' token':'');if(pos[0]===x&&pos[1]===y)cell.innerHTML=art('person','#923b44');else if(info[c]&&!collected.has(c))cell.innerHTML=art(info[c][0]);else if(c==='E')cell.innerHTML=art('arch','#fff0a2');m.append(cell)}))}function move(d){let [dx,dy]=dirs[d],x=pos[0]+dx,y=pos[1]+dy,c=rows[y]?.[x];if(!c||c==='#')return;if(c==='E'&&collected.size<4){$('msg').textContent='A saída está fechada. Recolha todos os artefatos.';return}pos=[x,y];steps++;$('maze-steps').textContent=steps+' passos'; function mapGame(){const cities=[{name:'Roma',x:45,y:43,hint:'Na Península Itálica, próxima ao rio Tibre.'},{name:'Cartago',x:38,y:67,hint:'Na costa do norte da África, atual Tunísia.'},{name:'Alexandria',x:75,y:78,hint:'Na costa do Egito, perto do delta do Nilo.'},{name:'Constantinopla',x:76,y:33,hint:'Na passagem entre a Europa e a Ásia, junto ao Bósforo.'},{name:'Londínio',x:28,y:15,hint:'Na Britânia, ilha ao noroeste da Europa.'}];if(roundNo){cities.splice(0,cities.length,{name:'Roma',x:45,y:43,hint:'Capital do Império, na península Itálica.'},{name:'Cartago',x:38,y:67,hint:'África romana, próxima ao Mediterrâneo.'},{name:'Alexandria',x:75,y:78,hint:'Porto do Egito, junto ao delta do Nilo.'},{name:'Constantinopla',x:76,y:33,hint:'Capital oriental, junto ao Bósforo.'},{name:'Londínio',x:28,y:15,hint:'Cidade comercial na Britânia.'})}const order=shuffle(cities.map((_,i)=>i));let step=0,miss=0;stage.innerHTML=`<h3>Cartógrafo romano</h3><p>Coloque o selo de cada cidade no local correspondente. Use as pistas de localização e explore o mapa.</p><div class="hud"><span id="map-count">0 / 5 cidades</span><span id="map-miss">0 tentativas erradas</span></div><div class="map-target" id="target"></div><div class="map-hint" id="hint"></div><div class="map" id="map"><svg viewBox="0 0 800 400" role="img" aria-label="Mapa esquemático da Europa, do Mediterrâneo e norte da África"><rect width="800" height="400" fill="#315761"/><g fill="#b5ae83" stroke="#746e59" stroke-width="3"><path d="M0 0H800V74L748 92 716 112 675 103 643 123 609 124 581 101 550 112 515 101 489 125 474 139 457 132 445 112 415 121 405 140 396 161 382 169 375 191 356 194 346 172 322 164 309 147 280 158 255 164 240 197 204 212 173 208 146 189 125 161 93 152 60 124 0 115Z"/><path d="M227 14l21 19 18 39-12 18-21-11-13-38Z"/><path d="M340 137l22 10 15 28 11 10 12 9-7 22-13-7-9-23-20-14-15-23Z"/><path d="M0 312l73-28 65-18 59-8 42 19 49-6 25-14 53 10 53 23 50-4 58 12 44 7 54-11 53 10 42-17 80 13V400H0Z"/><path d="M558
