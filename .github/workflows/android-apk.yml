name: Build Android APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          BUILD="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          test -f "$PLATFORM"
          mkdir -p build/res/drawable build/obj build/dex
          cp app-icon-192.png build/res/drawable/icon.png
          "$BUILD/aapt2" compile --dir build/res -o build/resources.zip
          "$BUILD/aapt2" link -o build/base.apk -I "$PLATFORM" --manifest android/AndroidManifest.xml build/resources.zip
          javac -source 8 -target 8 -classpath "$PLATFORM" -d build/obj android/MainActivity.java
          "$BUILD/d8" --lib "$PLATFORM" --min-api 23 --output build/dex $(find build/obj -name '*.class')
          (cd build/dex && zip -j ../base.apk classes.dex)
          "$BUILD/zipalign" -f 4 build/base.apk build/aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/portal.p12" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias portal -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Portal da Historia"
          "$BUILD/apksigner" sign --ks "$RUNNER_TEMP/portal.p12" --ks-pass "pass:$PASS" --out build/Portal-da-Historia.apk build/aligned.apk
          "$BUILD/apksigner" verify --verbose build/Portal-da-Historia.apk
      - name: Publish test version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.1 >/dev/null 2>&1; then
            echo "Version already published; preserving its original signing identity."
          else
            gh release create android-v1.1 build/Portal-da-Historia.apk --title "Portal da História Android 1.1" --notes "Versão de teste com correção das barras do sistema. A assinatura mudou; a instalação sobre a versão anterior não é possível."
          fi
